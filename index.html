<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Sidebar start -->
      <div class="sidebar">
        <div class="branding">
          <img src="icons/menu.svg" alt="" />
          <a href="#">Dashboard</a>
        </div>
        <div class="work">
          <div class="sidebar-item">
            <img src="/icons/home.svg" alt="" />
            <a href="#">Home</a>
          </div>
          <div class="sidebar-item">
            <img src="icons/account-box.svg" alt="" />
            <a href="#">Profile</a>
          </div>
          <div class="sidebar-item">
            <img src="icons/message.svg" alt="" />
            <a href="#">Messages</a>
          </div>
          <div class="sidebar-item">
            <img src="icons/history.svg" alt="" />
            <a href="#">History</a>
          </div>
          <div class="sidebar-item">
            <img src="icons/briefcase.svg" alt="" />
            <a href="#">Tasks</a>
          </div>
          <div class="sidebar-item">
            <img src="icons/group.svg" alt="" />
            <a href="#">Communities</a>
          </div>
        </div>
        <div class="account">
          <div class="sidebar-item">
            <img src="icons/cog.svg" alt="" />
            <a href="#">Settings</a>
          </div>
          <div class="sidebar-item">
            <img src="icons/help-box.svg" alt="" />
            <a href="#">Support</a>
          </div>
          <div class="sidebar-item">
            <img src="icons/shield-account.svg" alt="" />
            <a href="#">Privacy</a>
          </div>
        </div>
      </div>
      <!-- Sidebar end -->

      <!-- Header start -->
      <div class="header">
        <div class="header-top">
          <div class="searcharea">
            <div class="search-icon">
              <img src="/icons/magnify.svg" alt="" />
            </div>
            <div class="search-box">
              <input type="text" />
            </div>
            <div class="bell">
              <img src="/icons/bell.svg" alt="" />
            </div>
          </div>

          <div class="user-small">
            <div class="user-image">
              <img src="images/foxpup.jpg" alt="" />
            </div>
            <div class="user-small-name">Doga Prasad</div>
          </div>
        </div>
        <div class="header-bottom">
          <div class="dp">
            <img src="images/foxpup.jpg" alt="" />
          </div>
          <div class="intro">
            <div class="greeting">Hi there,</div>
            <div class="main-name">Doga Prasad (@doga)</div>
          </div>
          <div class="post">
            <button>New</button>
            <button>Upload</button>
            <button>Share</button>
          </div>
        </div>
      </div>
      <!-- Header end -->

      <!-- Main content start -->
      <div class="main">Main</div>
      <!-- Main content end -->
    </div>
  </body>
</html>
